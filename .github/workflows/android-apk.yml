name: Build Basic Chart Android APK

on:
  push:
    branches: [basic-chart-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basic-chart-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Basic Chart
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve Basic Chart overrides
        run: |
          mkdir -p /tmp/basic-chart-overrides /tmp/basic-chart-workflows
          cp .github/workflows/android-apk.yml /tmp/basic-chart-workflows/android-apk.yml
          for path in \
            BASIC_CHART_VERSION \
            src/Root.tsx \
            src/terminal/BasicTerminal.tsx \
            src/pages/BasicChartPage.tsx \
            src/adapter/provider.tsx \
            src/components/AdapterMarketDataBridge.tsx \
            src/components/ConnectionIndicator.tsx \
            examples/dnse-adapter/dnse-adapter.ts \
            src/pages/trading/ChartPanel.tsx \
            src/pages/trading/useIndicators.ts \
            src/lib/indicators.ts \
            src/pages/trading/useReplayPlayback.ts \
            src/pages/trading/useReplayChartData.ts \
            src/services/replay.ts \
            src/__tests__/dnse-adapter.test.ts \
            src/__tests__/adapter.test.tsx \
            src/services/queries.ts \
            src/services/api.ts \
            src/services/store.tsx \
            src/terminal/context.tsx \
            src/terminal/use-terminal.ts \
            src/services/demo/instruments.ts \
            src/services/demo/feed.ts \
            src/services/demo/engine.ts \
            src/services/schemas.ts; do
            mkdir -p "/tmp/basic-chart-overrides/$(dirname "$path")"
            cp "$path" "/tmp/basic-chart-overrides/$path"
          done

      - name: Import clean upstream OpenCharts source
        run: |
          git clone --depth 1 https://github.com/dylanpersonguy/OpenCharts.git /tmp/opencharts
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/opencharts/ ./
          mkdir -p .github/workflows
          cp /tmp/basic-chart-workflows/android-apk.yml .github/workflows/android-apk.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Basic Chart app and market-data overrides
        run: |
          cp -a /tmp/basic-chart-overrides/. ./
          test -f src/terminal/BasicTerminal.tsx
          test -f src/pages/BasicChartPage.tsx
          test -f examples/dnse-adapter/dnse-adapter.ts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add Capacitor Android shell
        run: |
          npm ci
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npm install mqtt --save
          npm pkg set name="basic-chart-android"
          npm pkg set scripts.android:sync="cap sync android"
          npm pkg set scripts.android:open="cap open android"
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.cuong007.basicchart',
            appName: 'Basic Chart',
            webDir: 'dist',
            android: { allowMixedContent: false },
          };
          export default config;
          EOF
          npx cap add android

      - name: Run automated tests
        run: npx vitest run --exclude 'src/hyperliquid/**'

      - name: Build chart-only web app
        env:
          VITE_ADAPTER: dnse
          VITE_BASIC_CHART: "1"
          VITE_CSP_EXTRA_CONNECT: "https://datafeed-krx.dnse.com.vn"
        run: |
          npm run typecheck
          npm run build

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          VERSION="$(tr -d '[:space:]' < BASIC_CHART_VERSION)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "basic-chart-v${VERSION}.apk"

      - name: Commit imported upstream and Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin basic-chart-v1
          git reset --soft origin/basic-chart-v1
          git checkout origin/basic-chart-v1 -- .github
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh upstream chart source for Basic Chart"
            git push origin HEAD:basic-chart-v1
          fi

      - name: Publish standalone APK release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < BASIC_CHART_VERSION)"
          TAG="basic-chart-v${VERSION}"
          APK="basic-chart-v${VERSION}.apk"
          gh release create "$TAG" "$APK" --target basic-chart-v1 --title "Basic Chart v${VERSION}" --notes "Standalone chart-only Android APK." || gh release upload "$TAG" "$APK" --clobber

      - name: Upload APK as CI fallback
        uses: actions/upload-artifact@v4
        with:
          name: basic-chart-v${{ github.run_number }}-apk
          path: basic-chart-v*.apk
          if-no-files-found: error
          retention-days: 30
