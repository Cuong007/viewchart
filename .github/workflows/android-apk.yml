name: Bootstrap OpenCharts Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout viewchart
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Android workflow and app feature overrides
        run: |
          mkdir -p /tmp/viewchart-workflows /tmp/viewchart-overrides
          cp .github/workflows/android-apk.yml /tmp/viewchart-workflows/android-apk.yml
          for path in \
            src/Root.tsx \
            src/adapterChoice.ts \
            src/adapter/provider.tsx \
            src/components/AdapterMarketDataBridge.tsx \
            src/components/ConnectionIndicator.tsx \
            examples/dnse-adapter/dnse-adapter.ts \
            examples/binance-adapter/binance-adapter.ts \
            src/pages/TradingPage.tsx \
            src/pages/trading/BottomPanel.tsx \
            src/components/trading-dialogs/TradeJournalPanel.tsx \
            src/pages/trading/ChartPanel.tsx \
            src/pages/trading/useIndicators.ts \
            src/lib/indicators.ts \
            src/lib/pine-script-runtime.ts \
            src/lib/pine-script-worker-client.ts \
            src/lib/pine-script.worker.ts \
            src/pages/trading/PineScriptEditor.tsx \
            src/pages/trading/usePinePlots.ts \
            examples/pine-scripts/opencharts-feature-test.pine \
            scripts/test-pine-sample.ts \
            src/pages/trading/useReplayPlayback.ts \
            src/pages/trading/useReplayChartData.ts \
            src/services/replay.ts \
            src/__tests__/engine.test.ts \
            scripts/test-replay-session.ts \
            src/__tests__/dnse-adapter.test.ts \
            src/services/queries.ts \
            src/services/api.ts \
            src/services/store.tsx \
            src/terminal/context.tsx \
            src/terminal/use-terminal.ts \
            src/pages/trading/ReplayHUD.tsx \
            src/pages/trading/ReplayScrubber.tsx \
            src/services/demo/instruments.ts \
            src/services/demo/feed.ts \
            src/services/demo/engine.ts \
            src/services/schemas.ts \
            src/pages/trading/OrderPanel.tsx; do
            mkdir -p "/tmp/viewchart-overrides/$(dirname "$path")"
            cp "$path" "/tmp/viewchart-overrides/$path"
          done

      - name: Import OpenCharts source
        run: |
          git clone --depth 1 https://github.com/dylanpersonguy/OpenCharts.git /tmp/opencharts
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/opencharts/ ./
          mkdir -p .github/workflows
          cp /tmp/viewchart-workflows/android-apk.yml .github/workflows/android-apk.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Android mobile tools overlay
        run: node .github/patches/patch-mobile-panels.mjs

      - name: Restore OpenCharts app feature overrides
        run: |
          # The upstream import intentionally refreshes the base project. Restore
          # our maintained feature files afterwards so replay/indicator changes
          # are actually included in the APK instead of being silently discarded.
          cp -a /tmp/viewchart-overrides/. ./
          # Fail with an explicit diagnostic only if the Binance override was not restored.
          test -f examples/binance-adapter/binance-adapter.ts || { echo "::error::Binance adapter file missing after restore"; exit 1; }
          grep -Fq 'PAXGUSDT' examples/binance-adapter/binance-adapter.ts || { echo "::error::PAXGUSDT mapping missing after restore"; exit 1; }
          grep -Fq 'PAXGUSD' examples/binance-adapter/binance-adapter.ts || { echo "::error::PAXGUSD display symbol missing after restore"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add Capacitor Android shell
        run: |
          npm ci
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npm install mqtt --save
          npm install pinets@0.13.1 --save
          npm pkg set name="viewchart-android"
          npm pkg set scripts.android:sync="cap sync android"
          npm pkg set scripts.android:open="cap open android"
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.cuong007.viewchart',
            appName: 'OpenCharts',
            webDir: 'dist',
            android: {
              allowMixedContent: false,
            },
          };

          export default config;
          EOF
          npx cap add android

      - name: Run full automated test suite
        run: npm run test

      - name: Smoke test Pine Script sample with PineTS
        run: npx tsx scripts/test-pine-sample.ts

      - name: Smoke test replay session date boundaries
        run: npx tsx scripts/test-replay-session.ts

      - name: Build web app (DNSE VN30F1M + Binance market data + paper trading)
        env:
          VITE_ADAPTER: dnse
          VITE_CSP_EXTRA_CONNECT: "https://api.binance.com https://data-api.binance.vision https://stream.binance.com:9443 wss://stream.binance.com:9443 wss://datafeed-krx.dnse.com.vn"
          VITE_CSP_ALLOW_TRADINGVIEW: "1"
        run: |
          npm run typecheck
          npm run build

      - name: Sync web assets and build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit imported source and Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The source import can take several minutes. Rebase its generated
          # files onto the latest workflow/patch commits before pushing.
          git fetch origin main
          git reset --soft origin/main
          git checkout origin/main -- .github
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import OpenCharts and add Capacitor Android project"
            git push origin HEAD:main
          fi

      - name: Upload openchart.apk
        uses: actions/upload-artifact@v4
        with:
          name: openchart-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
